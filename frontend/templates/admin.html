<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDream - Admin</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols_Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <!-- Main Style -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- Navigation -->
    <nav class="nav-floating">
        <a href="/index.html" class="nav-brand">BigDream <span class="admin-badge">Admin</span></a>

        <div class="nav-tabs" id="adminNavTabs">
            <a href="/home.html"><i class="fas fa-home"></i> <span>Dashboard</span></a>
            <a href="/goals.html"><i class="fas fa-bullseye"></i> <span>Goals</span></a>
            <a href="/account.html"><i class="fas fa-user"></i> <span>Account</span></a>
            <a href="/admin.html" class="active"><i class="fas fa-shield-alt"></i> <span>Admin</span></a>
        </div>

        <div class="nav-user">
            <button class="hamburger-btn" id="navHamburger" aria-label="Menu">
                <i class="fas fa-bars"></i>
            </button>
            <div id="userAvatar" style="display:none;"></div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="app-container app-container--wide">
        <div class="page-header">
            <h1 class="page-title"><i class="fas fa-shield-alt"></i> Admin Dashboard</h1>
            <p class="page-sub">System overview and user management</p>
        </div>

        <!-- Stats Grid -->
        <div class="stats-grid" id="stats-grid">
            <div class="admin-stat-card">
                <div class="stat-label">Total Users</div>
                <div class="stat-number" id="stat-total-users">-</div>
            </div>
            <div class="admin-stat-card">
                <div class="stat-label">Active Users</div>
                <div class="stat-number" id="stat-active-users">-</div>
            </div>
            <div class="admin-stat-card">
                <div class="stat-label">Total Goals</div>
                <div class="stat-number" id="stat-total-goals">-</div>
            </div>
            <div class="admin-stat-card">
                <div class="stat-label">Total Content</div>
                <div class="stat-number" id="stat-total-content">-</div>
            </div>
        </div>

        <!-- Users Management -->
        <div class="card">
            <h3><i class="fas fa-users"></i> User Management</h3>

            <input type="text"
                   class="search-input mt-2"
                   id="user-search"
                   placeholder="Search users by name, email, or handle...">

            <div id="users-table-container">
                <table class="users-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Joined</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-tbody">
                        <tr><td colspan="6" class="table-empty-cell">Loading users...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Audit Log -->
        <div class="card card-mt">
            <h3><i class="fas fa-history"></i> Recent Activity</h3>
            <div id="audit-log" class="mt-2">
                <p class="text-muted">Loading audit log...</p>
            </div>
        </div>
    </main>

    <script src="/static/js/admin.js"></script>

</body>
</html>
