<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDream - Forgot Password</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

    <div class="ambient-glow"></div>

    <nav class="auth-nav">
        <a href="/" class="auth-nav-brand">BigDream</a>
        <a href="/login.html" class="auth-nav-link">Sign In</a>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>
            <div class="auth-body">
                <div class="auth-logo-mark"><i class="fas fa-key"></i></div>
                <h1 class="auth-title">Forgot Password</h1>
                <p class="auth-subtitle">Enter your email to receive a reset code</p>

                <div id="message" class="message-box" style="display: none;">
                    <i class="fas fa-info-circle" id="messageIcon"></i>
                    <span id="messageText"></span>
                </div>

                <form id="forgotForm">
                    <div class="auth-form-group">
                        <label>Email Address</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-envelope auth-input-icon"></i>
                            <input
                                type="email"
                                id="email"
                                required
                                class="auth-input-with-icon"
                                placeholder="you@example.com"
                            />
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn-full">
                        <span id="submitBtnText">Send Reset Code</span>
                        <span id="submitSpinner" class="spinner" style="display: none;"></span>
                    </button>
                </form>

                <div class="auth-footer--row">
                    <span>Remember your password?</span>
                    <a href="/login.html" class="auth-link">Sign In →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/forgot-password.js"></script>

</body>
</html>
