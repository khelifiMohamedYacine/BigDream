<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDream - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
    <div class="ambient-glow"></div>

    <nav class="auth-nav">
        <a href="/index.html" class="auth-nav-brand">BigDream</a>
        <a href="/register.html" class="auth-nav-link">Sign Up</a>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>

            <div class="auth-body">
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Sign in to your account</p>

                <!-- Error / Success message -->
                <div id="errorMessage" class="message-box error" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <!-- Login form -->
                <form id="loginForm">
                    <div class="auth-form-group">
                        <label for="email">Email Address</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-envelope auth-input-icon"></i>
                            <input type="email" id="email" required
                                class="auth-input-with-icon"
                                placeholder="you@example.com">
                        </div>
                    </div>

                    <div class="auth-form-group">
                        <label for="password">Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-lock auth-input-icon"></i>
                            <input type="password" id="password" required
                                class="auth-input-with-icon"
                                placeholder="••••••••••">
                        </div>
                        <div class="auth-forgot">
                            <a href="/forgot-password.html" class="auth-link">Forgot Password?</a>
                        </div>
                    </div>

                    <button type="submit" id="loginBtn" class="btn-full">
                        <span id="loginBtnText">Sign In</span>
                        <span id="loginSpinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>

                <div class="auth-divider"><span>Or</span></div>

                <div class="auth-link-section">
                    <span>Don't have an account?</span>
                    <a href="/register.html" class="auth-link">Create one →</a>
                </div>

                <div class="auth-footer">
                    <button onclick="guestAccess()" class="auth-guest-btn">
                        <i class="fas fa-eye-slash"></i>
                        <span>Continue as Guest</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
