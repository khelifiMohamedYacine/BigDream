<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigDream - Create Account</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">
    <div class="ambient-glow"></div>

    <nav class="auth-nav">
        <a href="/index.html" class="auth-nav-brand">BigDream</a>
        <a href="/login.html" class="auth-nav-link">Sign In</a>
    </nav>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-accent-bar"></div>

            <div class="auth-body">
                <h1 class="auth-title">Get Started</h1>
                <p class="auth-subtitle">Create your free account</p>

                <!-- Error / Success message -->
                <div id="message" class="message-box" style="display:none;">
                    <span class="material-symbols-outlined" id="messageIcon">info</span>
                    <span id="messageText"></span>
                </div>

                <!-- Register form -->
                <form id="registerForm">
                    <!-- Name -->
                    <div class="auth-form-group">
                        <label for="name">Full Name</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-user auth-input-icon"></i>
                            <input type="text" id="name" required minlength="2"
                                class="auth-input-with-icon" placeholder="John Doe">
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="auth-form-group">
                        <label for="email">Email Address</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-envelope auth-input-icon"></i>
                            <input type="email" id="email" required
                                class="auth-input-with-icon" placeholder="you@example.com">
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="auth-form-group">
                        <label for="password">Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-lock auth-input-icon"></i>
                            <input type="password" id="password" required minlength="8"
                                oninput="checkPasswordStrength()"
                                class="auth-input-with-icon" placeholder="••••••••••">
                        </div>

                        <!-- Strength bars -->
                        <div class="password-strength">
                            <div class="strength-bars">
                                <div id="str1" class="strength-bar"></div>
                                <div id="str2" class="strength-bar"></div>
                                <div id="str3" class="strength-bar"></div>
                                <div id="str4" class="strength-bar"></div>
                            </div>
                            <p class="strength-text">Strength: <span id="strengthLevel">—</span></p>
                        </div>

                        <!-- Requirements -->
                        <div class="password-requirements">
                            <p id="req1">
                                <span class="material-symbols-outlined">radio_button_unchecked</span>
                                Minimum 8 characters
                            </p>
                            <p id="req2">
                                <span class="material-symbols-outlined">radio_button_unchecked</span>
                                At least one uppercase letter
                            </p>
                            <p id="req3">
                                <span class="material-symbols-outlined">radio_button_unchecked</span>
                                At least one number
                            </p>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="auth-form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="auth-input-wrapper">
                            <i class="fas fa-lock auth-input-icon"></i>
                            <input type="password" id="confirmPassword" required
                                class="auth-input-with-icon" placeholder="••••••••••">
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="checkbox-label mt-2">
                        <input type="checkbox" id="terms" required>
                        <label for="terms">
                            I agree to the <span class="icon-cyan">Terms of Service</span> and Privacy Policy
                        </label>
                    </div>

                    <!-- Submit -->
                    <button type="submit" id="registerBtn" class="btn-full mt-3">
                        <span id="registerBtnText">Create Account</span>
                        <span id="registerSpinner" class="spinner" style="display:none;"></span>
                    </button>
                </form>

                <div class="auth-footer">
                    <span>Already have an account?</span>
                    <a href="/login.html" class="auth-link">Sign in →</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/register.js"></script>
</body>
</html>
